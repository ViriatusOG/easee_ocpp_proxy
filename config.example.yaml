# Easee OCPP Proxy — example configuration.
# Copy to config.yaml and edit. See docs/REQUIREMENTS.md and docs/IMPLEMENTATION_PLAN.md.

listen_addr: ":9000"            # single port for ws:// OCPP and http:// /admin (D-2)
heartbeat_interval_s: 300       # advertised to local CPs; idle liveness cutoff = 2× (FR-24)
upstream_timeout_s: 30          # initial upstream dial/connect timeout only (FR-17)

# Allow-list of downstream Easee CP IDs (≤25 chars, FR-3/FR-5a).
# Each Easee connects to  ws://<proxy-host>:9000/<id>  (root path, D-8).
chargepoints:
  - K9PZQ4RT
  - M4XTR7Q2

# The single remotely-managed chargepoint, or "" for none (FR-6/FR-7).
proxied_id: K9PZQ4RT

# Friendly names shown on the dashboard instead of the raw CP ID (FR-42).
aliases:
  K9PZQ4RT: Garage Left

# Charging schedules (FR-41). Times are local wall-clock, DST-aware. A window may
# cross midnight. timezone is an IANA name; blank = server local time.
timezone: ""            # e.g. Europe/London
schedules:
  - name: overnight
    start: "23:30"
    stop: "05:30"
device_schedules:       # CP ID → schedule name; unlisted CPs charge any time
  K9PZQ4RT: overnight
schedule_paused:        # CP IDs whose assigned schedule is paused = "always on" (FR-43)
  # K9PZQ4RT: true       # keep the schedule assigned but ignore it (charge any time)

# Synchronised local CPs mirror the proxied CP's start/stop, so a second vehicle shares
# the remote server's charging windows (FR-48). Only valid while proxied_id is set; a
# synchronised CP's energy is never reported upstream. Managed from the dashboard role
# selector — these two keys are written automatically, shown here for reference.
synchronised: []        # e.g. [M4XTR7Q2]
saved_roles: {}         # CP ID → role to auto-restore when displaced from proxied / demoted

# Upstream CSMS — used only when a CP is proxied (D-3/D-7/D-8).
remote:
  url: wss://csms.example.com                 # base: scheme + host [+ optional path prefix]
  upstream_id: a3f71c92-6b48-4e05-9d1f-2c7a5e0b93d4   # appended to url; may exceed 25 chars (D-7)
  username: ""                                # optional; defaults to upstream_id (OCPP Basic auth)
  password_enc: ""                            # authorization key; set via the admin UI (FR-35)

# Force a BootNotification to the CSMS on every upstream connect / mode-switch (FR-44),
# so it re-provisions the charger. Needed the first time a charger is handed to the CSMS
# (fixes "session open, 0 kWh" accounting). Once the CSMS has pushed its configuration to
# the charger this re-boot is redundant — set false to stop churning it on each connect.
proxy_force_boot: true

# Present the CSMS one continuous, monotonic meter across proxied-unit switches (FR-47).
# Only relevant when more than one physical charger is rotated through a single remote
# identity: each unit has its own lifetime meter, so switching makes the CSMS see the
# register jump — a backwards jump can break its session history. When enabled, the
# absolute energy register sent upstream (meterStart/meterStop and MeterValues) is mapped
# onto one never-decreasing virtual meter; per-session energy (meterStop-meterStart) is
# unchanged. Default off. Enable it while the highest-reading unit is proxied, then leave
# it on. The high-water mark persists in a sidecar file (.easee-proxy-meter.json).
proxy_normalise_meter: false

# Local auto-start: send RemoteStartTransaction when an auto-authorised chargepoint
# reports a connector "Preparing" but waits for backend authorisation (D-11). Needed
# for chargers (e.g. Wallbox) that don't self-start when online. Disable for chargers
# that start on their own.
local_auto_start:
  enabled: true
  id_tag: PROXY

# BootNotification anonymisation for the proxied CP (D-6/FR-21a).
# vendor/model are always replaced; firmware/serial pass through unless set.
boot_anonymise:
  charge_point_vendor: Wallbox
  charge_point_model: Pulsar
  # firmware_version: ""
  # serial_number: ""

# Admin UI credentials (D-4/FR-31). password_hash is bcrypt; set via the admin UI.
admin:
  username: admin
  password_hash: ""

# Bearer token for the JSON API used by integrations e.g. Home Assistant (FR-46).
# Empty = API disabled. Generate/manage it from the admin UI (Account → API token).
api_token: ""
